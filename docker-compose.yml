services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: instatrack
      POSTGRES_USER: instatrack
      POSTGRES_PASSWORD: local-password
    # Keep PostgreSQL reachable from the VM itself for administration, but not
    # from the public internet. The API and collector use the internal
    # Compose network and do not need a host port.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instatrack -d instatrack"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    image: instatrack-app:local
    build: .
    restart: unless-stopped
    init: true
    ipc: host
    environment:
      DATABASE_URL: postgresql+psycopg://instatrack:local-password@db:5432/instatrack
      TEAM_PASSWORD_HASH: ${TEAM_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      SECURE_COOKIES: "${SECURE_COOKIES:-false}"
      LOCAL_COLLECTOR_ENABLED: "${LOCAL_COLLECTOR_ENABLED:-true}"
      COLLECTOR_ADAPTER: "${COLLECTOR_ADAPTER:-scrapling}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Tbilisi}"
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  collector:
    image: instatrack-app:local
    init: true
    ipc: host
    entrypoint: ["python", "-m", "app.collector"]
    command: ["--trigger", "scheduled"]
    environment:
      DATABASE_URL: postgresql+psycopg://instatrack:local-password@db:5432/instatrack
      COLLECTION_DELAY_SECONDS: "5"
      COLLECTOR_ADAPTER: "scrapling"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["manual"]
volumes:
  postgres_data:
